# Create the app at https://api.slack.com/apps > Create New App > From a manifest.
_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Lead to Deal Copilot
  description: Turns inbound leads into HubSpot deals that a person approves with one click.
  background_color: "#1d3557"
features:
  bot_user:
    display_name: Lead Copilot
    always_online: true
  shortcuts:
    - name: Create lead from message
      type: message
      callback_id: create_lead_from_message
      description: Turn this message into a lead and a draft HubSpot deal
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
